<style>
/* Pushyara — "night almanac" system.

   Type: Bricolage Grotesque for display, Mukta for body (Latin + Devanagari in one family, so Hindi reads native). */
:root{

  --sindoor:#D3232C; --sindoor-soft:#FDE4E4; --neel:#3934D8; --neel-soft:#E6E5FF; --night:#1A1440;
  /* legacy names used by app.js inline markup */
  --yellow:var(--marigold); --red:var(--sindoor); --red-text:var(--sindoor); --pink:var(--rani); --blue:var(--neel); --purple:#6A3FD8; --lime:#9BE15D; --green:var(--peacock); --green-text:var(--peacock);
  --kumkum:var(--rani); --kumkum-soft:var(--rani-soft); --haldi:#8A5A00; --haldi-soft:var(--marigold-soft); --mor:var(--peacock); --mor-soft:var(--peacock-soft); --neel-s:var(--neel-soft);
  --link:var(--ink); --on-strong:#FFFFFF; --soft-line:var(--line);
  --display:'Bricolage Grotesque','Mukta',system-ui,sans-serif; --body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif; --logo:var(--display);
  --deva:'Tiro Devanagari Hindi','Mukta',serif; --mono:'Mukta',system-ui,sans-serif; --navh:68px;
  --r-lg:22px; --r:16px; --r-sm:12px; --lift:0 1px 0 rgba(26,20,64,.04),0 8px 24px -12px rgba(26,20,64,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110D2A; --surface:#1B1640; --raised:#221C4C; --sunk:#0B081E; --ink:#F3F1FF; --muted:#B3ADD8; --line:#302A62; --strong:#F3F1FF;
  --marigold-soft:#3A2A06; --rani:#FF5A9D; --rani-soft:#3A1230; --peacock:#43D4CB; --peacock-soft:#0D3533; --sindoor:#FF6B6B; --sindoor-soft:#3C1418; --neel:#A5A2FF; --neel-soft:#24205A;

  --haldi:var(--marigold); --lift:0 10px 30px -16px rgba(0,0,0,.7); color-scheme:dark}

@media (prefers-reduced-motion:no-preference){.hero svg.wheel{animation:spin 140s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.hero .btn{background:var(--marigold);color:#1A1440} .hero .btn.ghost{background:transparent;color:#F3F1FF;box-shadow:inset 0 0 0 1.5px rgba(243,241,255,.6)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2.stats3{grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 16px} .stat b{display:block;font:800 1.8rem/1.05 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}

@media (max-width:540px){.stat b{font-size:1.35rem}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--night);color:#F3F1FF;font:700 1rem var(--body);letter-spacing:0;text-transform:none;padding:12px 22px;border-radius:99px;cursor:pointer;text-decoration:none;min-height:48px;box-shadow:none;transition:transform .1s,background .15s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.97)}

:focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:8px}

.jump{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--navh) + 26px + env(safe-area-inset-bottom,0px));z-index:24;display:inline-flex;gap:6px;align-items:center;font:700 .92rem var(--body);padding:10px 16px;border-radius:99px;border:0;background:var(--marigold);color:#1A1440;cursor:pointer;box-shadow:0 10px 24px -10px rgba(17,13,42,.6)}

.langswitch{display:inline-flex;padding:4px;border-radius:99px;background:rgba(243,241,255,.12);gap:2px;justify-self:start}
.langswitch button{font:700 .9rem var(--body);border:0;border-radius:99px;padding:6px 14px;background:transparent;color:#F3F1FF;cursor:pointer;min-height:36px}

.score{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline} .score b{font:800 2.4rem/1 var(--display);letter-spacing:-.04em}

@media (max-width:540px){.grid2.plans{grid-template-columns:1fr} h1{font-size:2rem} h2{font-size:1.45rem} .hero .t{font-size:1.75rem} .form .two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .24s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
.pdfbtn{font:700 .9rem var(--body);border:1.5px solid rgba(243,241,255,.4);border-radius:99px;padding:6px 14px;background:transparent;color:#F3F1FF;cursor:pointer;min-height:36px;margin-left:8px}
.pdfbtn:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
